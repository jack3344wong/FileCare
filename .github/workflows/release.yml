name: release

# 打 vX.Y.Z 标签即自动构建安装包并发布到 GitHub Releases。
#
# 应用内「检查更新」正是从 Releases 读取最新版本、下载这里的产物，
# 因此产物文件名必须保持 FileCare-Setup-<版本>.exe 这一形式，
# 且标签必须与 src/version.py 里的 APP_VERSION 一致（下方有校验步骤）。
#
# 手动触发（workflow_dispatch）只构建、发布，不创建 Release。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Inno Setup 7
        shell: pwsh
        run: |
          # 运行器预装的是 Inno Setup 6，而本项目的安装脚本用到了 Inno 7
          # 才有的 NativeInt 类型，用 6 编译会直接报错，所以必须装 7。
          #
          # 注意：jrsoftware.org/download.php/is.exe 现在只会 302 到下载选择页
          # （isdl.php），拿到的是一张 HTML 而不是安装程序，直接用会失败。
          # 这里改用官方 GitHub 仓库的版本直链，版本固定在 7.1.0。
          $version = "7.1.0"
          $url = "https://github.com/jrsoftware/issrc/releases/download/" +
                 "is-7_1_0/innosetup-$version-x64.exe"
          $setup = Join-Path $env:RUNNER_TEMP "innosetup-$version-x64.exe"
          Write-Host "下载 Inno Setup $version : $url"
          Invoke-WebRequest -Uri $url -OutFile $setup
          Start-Process -FilePath $setup `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-" -Wait

          $candidates = @(
            (Join-Path $env:ProgramFiles "Inno Setup 7\ISCC.exe"),
            (Join-Path ${env:ProgramFiles(x86)} "Inno Setup 7\ISCC.exe")
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "安装 Inno Setup 7 之后仍找不到 ISCC.exe" }
          Write-Host "ISCC: $iscc"
          "ISCC_PATH=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
          cache: pip

      - name: 安装锁定的 Win7 发布依赖
        run: python -m pip install -r requirements-win7.txt

      - name: 校验版本号一致
        shell: pwsh
        run: python tools/check_release_version.py

      - name: 回归测试
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:PYTHONUTF8 = "1"
          $env:USERPROFILE = Join-Path $env:GITHUB_WORKSPACE ".test-profile"
          New-Item -ItemType Directory -Force $env:USERPROFILE | Out-Null
          python test_win7_compatibility.py
          python test_quick_search_completeness.py
          python test_fulltext_search.py
          python -m unittest src.test_phase3
          python test_e2e_treemap.py
          python test_hidden_files.py
          python test_ui_smoke.py
          python test_update_core.py

      - name: 构建便携版（PyInstaller）
        run: python -m PyInstaller packaging/FileCare.spec --noconfirm --clean

      - name: 编译安装包（Inno Setup 7）
        shell: pwsh
        run: |
          & $env:ISCC_PATH packaging/FileCare.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup 编译失败" }

          $exe = Get-ChildItem installer-output/FileCare-Setup-*.exe |
            Select-Object -First 1
          if (-not $exe) { throw "没有找到编译产物 FileCare-Setup-*.exe" }

          # 生成 SHA256 校验文件，与发布页已有的 .sha256 附件保持一致。
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($exe.Name)" | Out-File "$($exe.FullName).sha256" -Encoding ascii
          Write-Host "产物: $($exe.Name)  SHA256=$hash"

      - name: 发布到 GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME

          # 发布说明直接取自 CHANGES.md，保证发布页与仓库改进记录一致。
          python tools/extract_changelog.py $tag | Out-File body.md -Encoding utf8

          $exe = Get-ChildItem installer-output/FileCare-Setup-*.exe |
            Select-Object -First 1

          # 带后缀的标签（如 v1.3.0-rc1）必须显式标记为预发布，否则
          # /releases/latest 会把它当成正式版，所有用户都会被提示升级到试发布包。
          $channel = if ($tag -match "-") { "--prerelease" } else { "--latest" }
          gh release create $tag `
            $exe.FullName `
            "$($exe.FullName).sha256" `
            --title "文件管家 $tag" `
            --notes-file body.md `
            $channel